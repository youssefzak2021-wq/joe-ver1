<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>joe · Discord servers</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--c1:#E9E3CD;--c2:#DDD5C1;--c3:#CDC5AF;--c4:#B7AF98;--ink:#2B2820;--mute:rgba(43,40,32,.66)}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:Tajawal,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 34%,var(--c3) 68%,var(--c4) 100%) fixed;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Tajawal,serif;font-weight:500;letter-spacing:-.02em;line-height:1.05}
html[lang=ar] h2,html[lang=ar] h3,html[lang=ar] .serif{font-family:Tajawal,sans-serif;font-weight:700;letter-spacing:0}
button,textarea{font:inherit;color:inherit}
a{color:inherit}
.blob{position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
.b1{width:46vw;height:46vw;left:-12vw;top:-14vw;background:#fff;opacity:.6}
.b2{width:42vw;height:42vw;right:-10vw;top:34vh;background:var(--c4);opacity:.5;animation-duration:20s}
.b3{width:34vw;height:34vw;left:34vw;bottom:-16vw;background:#fff;opacity:.45;animation-duration:24s}
@keyframes drift{to{transform:translate(3vw,-4vh) scale(1.08)}}
.glass{position:relative;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.2));backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 30px 60px -30px rgba(43,40,32,.5)}
.rim::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--a),transparent 0 72%,rgba(255,255,255,.95) 84%,transparent 96%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 7s linear infinite;pointer-events:none}
@keyframes spin{to{--a:360deg}}
.tilt{transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.gbtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:14px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:700;text-decoration:none;cursor:pointer;box-shadow:inset 0 1px 0 #fff,0 12px 24px -14px rgba(43,40,32,.5);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,background .3s}
.gbtn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);transform:translateX(-120%);transition:transform .9s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.gbtn:hover::after{transform:translateX(120%)}
.gbtn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 #fff,0 18px 30px -14px rgba(43,40,32,.55)}
.gbtn:active{transform:scale(.97)}
.gbtn.dark{background:rgba(43,40,32,.86);color:#F4EFDF;border-color:rgba(255,255,255,.12)}
.gbtn.dark::after{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%)}
.gbtn.sm{min-height:38px;padding:0 16px;font-size:14px;border-radius:12px}
.gbtn.x{position:absolute;inset-inline-end:14px;top:14px;width:36px;min-height:36px;padding:0}
.gbtn.full{width:100%}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.link{background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.nav{position:sticky;top:14px;z-index:30;max-width:1160px;margin:14px auto 0;padding:10px 10px 10px 22px;border-radius:999px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:Fraunces,serif;font-weight:600;font-size:30px;letter-spacing:-.04em;text-decoration:none}
.links{display:flex;gap:2px}
.links a{text-decoration:none;font-weight:500;padding:9px 14px;border-radius:999px;transition:background .3s}
.links a:hover{background:rgba(255,255,255,.5)}
main{max-width:1160px;margin:0 auto;padding:0 6vw}
.hero{padding-top:clamp(36px,7vw,80px)}
.wm{display:flex;direction:ltr;font-family:Fraunces,serif;font-weight:600;font-size:clamp(130px,30vw,330px);line-height:.8;letter-spacing:-.06em;margin-inline-start:-.04em;padding-bottom:.32em}
.wm span{display:inline-block;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
.wm span:nth-child(2){animation-delay:.12s}
.wm span:nth-child(3){animation-delay:.24s}
@keyframes rise{from{transform:translateY(60%);opacity:0;filter:blur(8px)}to{transform:none;opacity:1;filter:none}}
.hero-grid{display:grid;grid-template-columns:1fr;gap:40px;align-items:end;margin-top:clamp(40px,6vw,70px)}
@media(max-width:820px){.hero-grid{grid-template-columns:1fr}}
.lead{font-size:clamp(20px,2.3vw,25px);line-height:1.5;max-width:30ch;margin-bottom:24px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chip{font-size:14px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.6)}



section{padding-top:84px}
.sh{display:grid;gap:12px;margin-bottom:34px}
h2{font-size:clamp(42px,6vw,72px)}
.sh p{font-size:19px;color:var(--mute);max-width:50ch;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.pkg{padding:28px;display:flex;flex-direction:column;gap:12px}
.pkg h3{font-size:30px;min-height:2.3em}
.pkg p{color:var(--mute);line-height:1.55;font-size:16px;min-height:4.7em}
.price{display:flex;align-items:baseline;gap:8px;color:var(--mute);font-size:15px;margin-top:6px}
.amt{font-family:Fraunces,serif;font-size:46px;color:var(--ink);font-weight:500;letter-spacing:-.03em}
.pkg .gbtn{width:100%;margin-top:auto}
.supp{padding:36px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px}
.supp h2{font-size:clamp(36px,5vw,56px)}
.supp p{color:var(--mute);font-size:18px;margin-top:10px;max-width:46ch;line-height:1.5}
footer{max-width:1160px;margin:0 auto;padding:70px 6vw 40px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:var(--mute);font-size:14px}
dialog{border:0;padding:0;background:none;color:var(--ink);width:min(480px,92vw);max-width:92vw;overflow:visible}
dialog::backdrop{background:rgba(43,40,32,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog[open]{animation:pop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}}
.sheet{position:relative;padding:28px;border-radius:26px;background:linear-gradient(160deg,rgba(252,250,242,.94),rgba(233,227,205,.94));backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 #fff,0 40px 80px -30px rgba(43,40,32,.6)}
.sheet h3{font-size:34px;margin-bottom:6px;padding-inline-end:40px}
.ask{color:var(--mute);line-height:1.5}
.step{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(43,40,32,.1)}
.n{display:flex;align-items:center;gap:6px}
.n button{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.6);font-size:20px;cursor:pointer;transition:transform .2s}
.n button:active{transform:scale(.88)}
.n b{min-width:46px;text-align:center;font-family:Fraunces,serif;font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;color:var(--mute)}
.tot{font-family:Fraunces,serif;font-size:44px;font-weight:500;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pulse{animation:pulse .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pulse{40%{transform:scale(1.07)}}
textarea{width:100%;margin-top:14px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.55);resize:vertical}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.reasons .gbtn{min-height:58px}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:30px;cursor:pointer;color:var(--c4);padding:0 2px}
.stars button.on{color:var(--ink)}
.rate{position:fixed;inset-inline-end:18px;bottom:18px;z-index:40}
.rate .pop{position:absolute;bottom:60px;inset-inline-end:0;width:290px;padding:18px;display:none;gap:10px;background:rgba(250,248,240,.9)}
.rate.open .pop{display:grid;animation:tin .45s cubic-bezier(.2,.8,.2,1)}
.rate .pop p{font-size:22px}
.coins{display:flex;flex-wrap:wrap;gap:8px}
.chipb{padding:8px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.5);font-weight:700;font-size:14px;cursor:pointer}
.chipb[aria-pressed=true]{background:var(--ink);color:#F4EFDF}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;background:rgba(43,40,32,.08);padding:12px;border-radius:12px}
.stat{justify-self:start;width:max-content;padding:5px 11px;border-radius:999px;background:rgba(43,40,32,.1);font-size:13px;font-weight:700}
.rowk{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(43,40,32,.12)}
.msg{background:rgba(255,255,255,.55);padding:10px 12px;border-radius:12px;font-size:15px;line-height:1.5}
.list{list-style:none;display:grid;gap:10px;padding:0}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.4)}
.item small{display:block;color:var(--mute);margin-top:3px}
.col{display:grid;justify-items:end;gap:6px}
.drawer{position:fixed;top:14px;bottom:14px;inset-inline-end:14px;width:min(420px,calc(100vw - 28px));z-index:60;overflow:auto;padding:26px;display:grid;align-content:start;gap:14px;background:rgba(250,248,240,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);transform:translateX(135%);transition:transform .75s cubic-bezier(.2,.8,.2,1)}
html[dir=rtl] .drawer{transform:translateX(-135%)}
.drawer.on,html[dir=rtl] .drawer.on{transform:none}
.toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:90vw;z-index:80;padding:14px 22px;border-radius:999px;font-weight:700;animation:tin .5s cubic-bezier(.2,.8,.2,1) both;transition:opacity .5s,transform .5s}
.toast.out{opacity:0;transform:translateY(12px)}
@keyframes tin{from{opacity:0;transform:translateY(20px)}}
.chead{display:flex;align-items:center;gap:12px}
.chead small{display:block;color:var(--mute);font-size:13px}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:Fraunces,serif;font-size:22px;background:var(--ink);color:#F4EFDF}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:44vh;overflow-y:auto;padding:4px 2px}
.mrow{display:flex}
.bub{max-width:84%;padding:11px 14px;border-radius:18px;border-end-start-radius:6px;background:rgba(255,255,255,.7);font-size:15px;line-height:1.5;white-space:pre-wrap;box-shadow:inset 0 1px 0 #fff,0 6px 14px -10px rgba(43,40,32,.45)}
.mrow:last-child .bub{animation:bin .45s cubic-bezier(.2,.8,.2,1) both}
.mine .bub{margin-inline-start:auto;background:var(--ink);color:#F4EFDF;border-end-start-radius:18px;border-end-end-radius:6px}
@keyframes bin{from{opacity:0;transform:translateY(10px) scale(.97)}}
.sumcard{display:grid;gap:2px;min-width:220px}
.sumcard b.serif{font-size:22px;margin-bottom:6px}
.pay{display:grid;gap:10px}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.3;animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.comp{display:flex;gap:8px;align-items:flex-end;padding:8px;border-radius:18px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.85)}
.comp textarea{margin:0;border:0;background:transparent;min-height:42px;max-height:120px;padding:9px 8px;resize:none}
.comp .gbtn{flex:none;min-height:42px}
.item{width:100%;border:0;cursor:pointer;text-align:start;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s}
.item:hover{transform:translateY(-2px);background:rgba(255,255,255,.7)}
.item small{display:block;color:var(--mute);margin-top:3px;font-size:13px}
dialog{margin:auto}
[hidden]{display:none!important}
.revs{margin:64px -6vw 0}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 6vw 16px}
.rhead h3{font-size:28px}
.rmask{overflow:hidden;direction:ltr;padding:4px 0 12px}
.rtrack{display:flex;gap:18px;width:max-content;animation:pong 24s ease-in-out infinite alternate}
.rmask:hover .rtrack{animation-play-state:paused}
.revs[data-dir=rev] .rtrack{animation-delay:-12s}
@keyframes pong{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.rcard{flex:none;width:300px;padding:20px;display:grid;gap:10px;text-align:start}
.rcard p{font-size:16px;line-height:1.5}
.rs{letter-spacing:3px;color:var(--ink)}
.cont{font-size:13px;color:var(--mute);line-height:1.5;margin-top:4px}
.codeRow{display:flex;gap:8px;margin-top:14px}
.codeRow input,.fld input{padding:11px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.55);color:var(--ink);font:inherit;font-size:16px;min-width:0}
.codeRow input{flex:1}
.flist{display:grid;gap:12px;margin-top:18px}
.fld{display:grid;gap:6px;font-size:14px;color:var(--mute)}
.err{color:#9c3b2b;font-size:14px;min-height:20px}
.staged{display:flex;flex-wrap:wrap;gap:6px}
.staged:empty{display:none}
.sg{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 4px;border-radius:12px;background:rgba(255,255,255,.75);font-size:13px}
.sg img{width:28px;height:28px;border-radius:8px;object-fit:cover}
.sg button{border:0;background:none;cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.comp-wrap{display:grid;gap:8px}
.bub img.sh{display:block;max-width:220px;border-radius:12px;margin-top:6px}
.fchip{display:inline-block;margin-top:6px;padding:5px 9px;border-radius:10px;background:rgba(43,40,32,.12);font-size:13px}
.pcoin{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:20px}
.coins-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.pcoin .mono{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:Fraunces,serif;font-size:24px;background:var(--ink);color:#F4EFDF}
.pcoin b{display:block;font-size:17px}
.pcoin small{color:var(--mute);font-size:13px;letter-spacing:.04em}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14px;color:var(--mute)}
.kv b{color:var(--ink);font-size:15px}
.amtc{font-family:Fraunces,serif;font-size:20px;font-variant-numeric:tabular-nums}
.warn{padding:12px 14px;border-radius:14px;background:rgba(156,59,43,.1);border:1px solid rgba(156,59,43,.35);color:#7a2c20;font-size:14px;line-height:1.5}
.warn b{display:block;margin-bottom:4px}
.warn p{margin:0}
.ack{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4;cursor:pointer}
.ack input{margin-top:3px;width:16px;height:16px;accent-color:#2B2820}
.pay .gbtn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pol{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid rgba(43,40,32,.12)}
.pol p{color:var(--mute);line-height:1.55;font-size:15px}
#policy .sheet{max-height:82vh;overflow:auto}
.tabs{display:flex;gap:8px;margin:34px 0 12px}
.tabs .gbtn{flex:1}
.tabs .gbtn[aria-pressed=true]{background:var(--ink);color:#F4EFDF}
.proof{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;border-radius:14px;background:rgba(255,255,255,.5)}
.proof img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.proof span{font-size:14px;flex:1}
.newslist{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.news{padding:24px;display:grid;gap:10px;align-content:start}
.news h3{font-size:24px}
.news p{color:var(--mute);line-height:1.55}
.otp{display:grid;gap:12px;justify-items:center;text-align:center;margin-top:20px}
.otp h3{padding-inline-end:0}
.otp-mail{font-weight:700;direction:ltr;font-size:16px}
.otp-boxes{display:flex;gap:8px;direction:ltr;margin:6px 0}
.otp-in{width:46px;height:56px;text-align:center;font-family:Fraunces,serif;font-size:24px;font-weight:600;border-radius:14px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.6);color:var(--ink);box-shadow:inset 0 1px 0 #fff}
.otp-in:focus{outline:2px solid var(--ink);outline-offset:2px}
.otp .gbtn{width:100%}
.otp-foot{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
#acct{display:none}
.mailin{width:100%;margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.55);color:var(--ink);font:inherit;font-size:16px}
@media(max-width:640px){.links{display:none}.nav{margin-inline:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<header class="nav glass">
  <a class="logo" href="#top">joe</a>
  <nav class="links">
    <a href="#create" data-k="navCreate"></a><a href="#upgrade" data-k="navUpgrade"></a><a href="#support" data-k="navSupport"></a>
  </nav>
  <button class="gbtn sm" id="myt" type="button" data-k="myTickets"></button>
  <button class="gbtn sm" id="acct" type="button"></button>
  <button class="gbtn sm" id="lang" type="button"></button>
</header>

<main id="top">
  <section class="hero">
    <h1 class="wm" aria-label="joe"><span>j</span><span>o</span><span>e</span></h1>
    <div class="hero-grid">
      <div>
        <p class="lead" data-k="heroLead"></p>
        <div class="row"><a class="gbtn dark" href="#create" data-k="heroCta"></a><span class="chip" data-k="heroNote"></span></div>
      </div>
    </div>
  </section>

  <section id="pay">
    <div class="sh"><h2 data-k="payTitle"></h2><p data-k="paySub"></p></div>
    <div class="coins-grid">
      <div class="glass pcoin tilt"><span class="mono">₿</span><div><b>Bitcoin</b><small>BTC</small></div></div>
      <div class="glass pcoin tilt"><span class="mono">Ξ</span><div><b>Ethereum</b><small>ETH</small></div></div>
      <div class="glass pcoin tilt"><span class="mono">₮</span><div><b>Tether</b><small>USDT · BEP20</small></div></div>
      
      <div class="glass pcoin tilt"><span class="mono">◎</span><div><b>Solana</b><small>SOL</small></div></div>
      <div class="glass pcoin tilt"><span class="mono">Ł</span><div><b>Litecoin</b><small>LTC</small></div></div>
    </div>
  </section>

  <div class="revs" data-dir="fwd"></div>

  <section id="create">
    <div class="sh"><h2 data-k="createTitle"></h2><p data-k="createSub"></p></div>
    <div class="cards">
      <article class="glass pkg tilt"><h3 data-k="pkg_community"></h3><p data-k="d_community"></p><div class="price"><span data-k="from"></span><span class="amt" data-base="community"></span></div><button class="gbtn dark" data-cfg="community" data-k="choose"></button></article>

function toast(msg){
  const el=document.createElement("div");
  el.className="toast glass";el.textContent=msg;document.body.append(el);
  setTimeout(()=>el.classList.add("out"),2600);setTimeout(()=>el.remove(),3200);
}

function pulse(el){el.classList.remove("pulse");void el.offsetWidth;el.classList.add("pulse")}

function paintCfg(){
  if(!S.pkg)return;
  $("#cfgTitle").textContent=t("pkg_"+S.pkg);
  for(const f in S.c)$("#c_"+f).textContent=S.c[f];
  $("#base").textContent=money(PK[S.pkg]);
  const dsc=S.disc?+(total()*S.disc).toFixed(2):0;
  $("#discRow").hidden=!dsc;$("#disc").textContent="−"+money(dsc);

function pause(ms){return new Promise(r=>setTimeout(r,ms))}
// plays a short conversation: joe "types", then the message lands
async function seq(tk,list){
  for(const x of list){
    tk.typing=true;refresh();
    await pause(x.d??900);
    tk.typing=false;tk.msgs.push(x.m);refresh();
  }
}

const users=()=>ACCOUNTS;

function setSession(email){if(!email){TOKEN="";try{localStorage.removeItem("joe_token")}catch(e){}}
  const u=users()[email];
  S.user=email?{email,used:!!(u&&u.used)}:null;
  try{email?localStorage.setItem("joe_session",email):localStorage.removeItem("joe_session")}catch(e){}

}

function paintAuth(){
  $("#authH").textContent=t(authUp?"authTitleUp":"authTitleIn");
  $("#authBtn").textContent=t(authUp?"authUp":"authIn");
  $("#tabIn").textContent=t("authIn");$("#tabUp").textContent=t("authUp");
  $("#tabIn").setAttribute("aria-pressed",String(!authUp));$("#tabUp").setAttribute("aria-pressed",String(authUp));

  $("#authErr").textContent="";

function submitAuth(){
  if(LIVE){liveAuth();return}
  const email=$("#aEmail").value.trim().toLowerCase(),pass=$("#aPass").value,u=users(),err=$("#authErr");
  err.textContent="";
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent=t("errEmail");return}
  if(pass.length<6){err.textContent=t("errPass");return}
  if(authUp){
    if(u[email]){err.textContent=t("errExists");return}
    u[email]={pass,used:false};saveUsers(u);
  }else if(!u[email]){err.textContent=t("errNoAcc");return}
  else if(u[email].pass!==pass){err.textContent=t("errWrong");return}
  setSession(email);$("#aPass").value="";$("#auth").close();
  toast(t("hi")+" "+email);
  if(S.pending){const f=S.pending;S.pending=null;f()}
}
function applyCode(){
  const v=$("#code").value.trim().toLowerCase(),msg=$("#codeMsg");
  S.disc=0;
  if(v!==((S.pricing&&S.pricing.code.word)||"joehere").toLowerCase())msg.textContent=t("codeBad");
  else{S.disc=((S.pricing&&S.pricing.code.percent)||10)/100;msg.textContent=t("codeOk")}
  paintCfg();
}
function stageFiles(list,img){
  [...list].forEach(f=>{
    if(f.size>8e6){toast(t("tooBig"));return}
    const it={name:f.name,img:img||f.type.startsWith("image/"),url:""};
    S.staged.push(it);
    if(it.img){const r=new FileReader();r.onload=()=>{it.url=r.result;paintPanel()};r.readAsDataURL(f)}
  });
  paintPanel();
}

function bubble(tk,m,who){
  let inner;
  if(m.kind==="sum")inner=`<div class="sumcard"><b class="serif">${t("pkg_"+tk.pkg)}</b>`+
    rowHTML(t("rooms"),tk.c.rooms)+rowHTML(t("roles"),tk.c.roles)+rowHTML(t("bots"),tk.c.bots)+
    (tk.pct?rowHTML(t("discount"),"−"+money(tk.sub-tk.total)):"")+rowHTML(t("total"),money(tk.total))+`</div>`;
  else if(m.kind==="pay")inner=who==="me"&&tk.status==="wait"?payHTML(tk):`${t("amtLabel")} <b>${payOf(tk).amount} ${tk.coin}</b>`;
  else if(m.kind==="inv"){
    const v=tk.inv;
    inner=`<div class="sumcard"><b class="serif">${t("invoiceTitle")} · ${v.no}</b>`+
      rowHTML(t("invDate"),v.date)+rowHTML(t("invBill"),v.email)+rowHTML(t("invPkg"),t("pkg_"+v.pkg))+
      rowHTML(t("invExtras"),`${v.c.rooms} / ${v.c.roles} / ${v.c.bots}`)+rowHTML(t("invSub"),money(v.sub))+
      (v.pct?rowHTML(t("invDisc"),"−"+money(v.sub-v.total)):"")+rowHTML(t("invTotal"),money(v.total))+
      rowHTML(t("invPay"),v.coin)+rowHTML(t("invStatus"),t("invPaid"))+
      `<p class="cont">${t("contentLine").replace("{r}",v.c.rooms).replace("{ro}",v.c.roles).replace("{b}",v.c.bots)}</p></div>`;
  }
  else inner=(m.text?esc(m.text):"")+(m.files||[]).map(f=>f.img&&f.url?`<img class="sh" src="${f.url}" alt="">`:`<span class="fchip">${esc(f.name)}</span>`).join("");
  return `<div class="mrow${m.f===who?" mine":""}"><div class="bub">${inner}</div></div>`;
}
const bubbles=(tk,who)=>tk.msgs.map(m=>bubble(tk,m,who)).join("")+

function keep(sel,fn){
  const el=$(sel),v=el?el.value:"",f=!!el&&document.activeElement===el;
  fn();
  const n=$(sel);
  if(n){n.value=v;if(f)n.focus()}
}
function paintPanel(){

    `<div class="row" style="justify-content:space-between"><span class="stat">${tk.id}</span><button class="gbtn sm" data-hide aria-label="Close">✕</button></div>`+
    headOf(tk)+`<div class="msgs" id="pmsgs">${bubbles(tk,"me")}</div>`+
    `<div class="comp-wrap"><div class="staged">${staged}</div><div class="comp"><button class="gbtn sm" data-att="img">${t("attPhoto")}</button><button class="gbtn sm" data-att="file">${t("attFile")}</button><textarea id="pdraft" rows="1" placeholder="${t("msgPh")}"></textarea><button class="gbtn dark sm" data-act="send">${t("send")}</button></div></div>`;
  });

function paintOwner(){

    S.own=null;
    const rows=S.tickets.map(x=>{
      const sup=x.type==="support",last=x.msgs.at(-1);
      const title=sup?t("r_"+x.reason):t("pkg_"+x.pkg)+" · "+cashOf(x.total);

    }).join("");

  });

}

function buy(){
  const email=buyEmail();if(!email)return;
  const sub=+total().toFixed(2),pct=S.disc?S.disc:0;
  const tk={id:"JOE-"+(++S.seq),type:"purchase",email,pkg:S.pkg,c:{...S.c},sub,pct,total:+(sub*(1-pct)).toFixed(2),status:"wait",coin:"BTC",msgs:[],typing:false};
  const notes=$("#notes").value.trim();
  const steps=[{m:{f:"joe",text:t("chatHello").replace("{id}",tk.id)},d:500},{m:{f:"joe",kind:"sum"},d:800},{m:{f:"joe",text:t("chatPickCoin")},d:900},{m:{f:"joe",kind:"pay"},d:900}];
  if(notes)steps.unshift({m:{f:"me",text:notes},d:0});
  S.disc=0;$("#code").value="";$("#codeMsg").textContent="";
  S.tickets.unshift(tk);S.act=tk;
  $("#cfg").close();$("#panel").innerHTML="";show("panel");
  notify(t("newTicket")+" "+tk.id);
  seq(tk,steps);
}
function openSupport(r,email){

  S.tickets.unshift(tk);S.act=tk;
  $("#sup").close();if(LIVE)api("/tickets",{type:"support",reason:r,email}).then(x=>{tk.tid=x.id;tk.ttoken=x.access;startPoll(tk)}).catch(()=>{});$("#panel").innerHTML="";show("panel");
  notify(t("newSupport")+" "+tk.id);
  seq(tk,[{m:{f:"joe",text:t("a_"+r)},d:800},{m:{f:"joe",text:t("chatSupFollow")},d:700}]);
}

function copyText(v){
  const done=()=>toast(t("copied"));
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=v;ta.style.position="fixed";ta.style.opacity="0";document.body.append(ta);ta.select();try{document.execCommand("copy")}catch(e){}ta.remove();done()};
  if(navigator.clipboard)navigator.clipboard.writeText(v).then(done,fallback);else fallback();
}
function openWallet(tk){

const LIVE=false;const API="/api";
let TOKEN=(()=>{try{return localStorage.getItem("joe_token")||""}catch(e){return ""}})();
async function api(path,body){
  const r=await fetch(API+path,{method:body!==undefined?"POST":"GET",headers:{"Content-Type":"application/json",Authorization:"Bearer "+TOKEN},body:body!==undefined?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"Something went wrong.");
  return j;
}
const payOf=tk=>tk.pay||{coin:tk.coin,addr:WALLET[tk.coin].addr,amount:cryptoAmt(tk),net:WALLET[tk.coin].net};
let PENDING=null,VERIFYING=false;
const AUTH_PARTS=["#authTabs","#authH","#authHint","#authForm"];

function hideOtp(){

function finishSignin(j){

async function liveAuth(){

async function verifyOtp(){
  if(!PENDING||VERIFYING)return;
  const code=$$(".otp-in").map(i=>i.value).join("");

  if(code.length!==6){$("#otpErr").textContent=t("otpNeed");return}

  catch(e){$("#otpErr").textContent=e.message;$$(".otp-in").forEach(i=>i.value="");$(".otp-in").focus()}

}
async function resendOtp(){

async function buyLive(){
  const notes=$("#notes").value.trim(),code=$("#code").value.trim(),email=buyEmail();if(!email)return;
  const tk={id:"",type:"purchase",pkg:S.pkg,c:{...S.c},status:"wait",coin:"BTC",msgs:[],typing:true,live:true,email};
  S.tickets.unshift(tk);S.act=tk;
  $("#cfg").close();$("#panel").innerHTML="";show("panel");refresh();
  try{
    const o=await api("/orders",{pkg:tk.pkg,c:tk.c,coin:tk.coin,notes,code,email});
    Object.assign(tk,{id:o.ref,oid:o.id,sub:o.sub,pct:o.pct,total:o.usd,pay:o.pay,token:o.token});
    api("/tickets",{type:"purchase",orderId:o.id,token:o.token}).then(x=>{tk.tid=x.id;tk.ttoken=x.access;startPoll(tk)}).catch(()=>{});
    S.disc=0;$("#code").value="";$("#codeMsg").textContent="";
    if(notes)tk.msgs.push({f:"me",text:notes});
    tk.typing=false;
    seq(tk,[{m:{f:"joe",text:t("chatHello").replace("{id}",tk.id)},d:500},{m:{f:"joe",kind:"sum"},d:800},{m:{f:"joe",text:t("chatPickCoin")},d:900},{m:{f:"joe",kind:"pay"},d:900}]);
    tk.timer=setInterval(()=>checkLive(tk),20000);
  }catch(e){tk.typing=false;tk.msgs.push({f:"joe",text:e.message});refresh()}
}
async function checkLive(tk,force){
  if(!tk.oid||tk.status==="done")return;
  try{
    const o=await api("/orders?id="+tk.oid+"&token="+tk.token);
    tk.pay=o.pay;
    if(o.status==="paid"){
      clearInterval(tk.timer);tk.status="done";tk.inv=o.inv;
      seq(tk,[{m:{f:"joe",text:t("chatConfirmed")},d:600},{m:{f:"joe",kind:"inv"},d:900},{m:{f:"joe",text:t("invSent")+" "+tk.email},d:600},{m:{f:"joe",text:t("chatDone")},d:900}]);
    }else{
      if(o.status==="seen")tk.status="verify";
      if(force)toast(t("notYet"));
      refresh();
    }
  }catch(e){if(force)toast(e.message)}
}
async function switchCoinLive(tk,coin){
  try{const o=await api("/orders?id="+tk.oid+"&action=coin",{coin,token:tk.token});tk.coin=coin;tk.ack=false;tk.pay=o.pay;tk.msgs.push({f:"me",text:t("chatCoinMe")+" "+coin});refresh()}
  catch(e){toast(e.message)}
}
function stageProof(f){
  if(!f||!f.type.startsWith("image/"))return;
  if(f.size>2.5e6){toast(t("tooBig"));return}
  const tk=S.act,r=new FileReader();
  r.onload=()=>{tk.proof={name:f.name,url:r.result,img:true};refresh()};
  r.readAsDataURL(f);
}
async function sendProofLive(tk){
  try{
    await api("/orders?id="+tk.oid+"&action=proof",{token:tk.token,name:tk.proof.name,image:tk.proof.url});
    tk.status="verify";tk.msgs.push({f:"me",text:t("paid"),files:[tk.proof]});
    seq(tk,[{m:{f:"joe",text:t("chatProofBot")},d:900}]);
  }catch(e){toast(e.message)}
}
const NEWS=[
{date:"2026-10-25",title:{en:"joehere: 10% off your first order",ar:"joehere: خصم 10% على أول طلب"},body:{en:"Sign in, then enter the code at checkout. It works once per account.",ar:"سجل دخولك، وبعدين اكتب الكود وقت الطلب. بيشتغل مرة واحدة لكل حساب."}},
{date:"2026-10-20",title:{en:"Fixed crypto rates",ar:"أسعار كريبتو ثابتة"},body:{en:"Each coin has a fixed USD rate shown at checkout. The amount is rounded up.",ar:"كل عملة ليها سعر ثابت بالدولار ظاهر وقت الدفع، والمبلغ بيتقرب لفوق."}}
];

// tickets are kept in the browser so the customer can reopen them any time
function saveTickets(){
  const put=v=>{try{localStorage.setItem("joe_tickets",v);return true}catch(e){return false}};
  if(!put(JSON.stringify(S.tickets)))put(JSON.stringify(S.tickets.map(x=>({...x,proof:x.proof?{name:x.proof.name}:undefined,msgs:x.msgs.map(m=>({...m,files:(m.files||[]).map(f=>({name:f.name}))}))}))));

const cashOf=v=>v==null?"…":money(v);
const EMAIL_OK=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
function buyEmail(){const e=$("#buyEmail").value.trim();if(!EMAIL_OK(e)){$("#buyErr").textContent=t("errEmail");return null}$("#buyErr").textContent="";return e}

// prices come from the owner's settings (live mode only)
async function loadPricing(){
  try{
    const P=await (await fetch("/api/settings")).json();
    Object.assign(PK,P.base);Object.assign(RATE,P.units);
    for(const c in P.rates)if(WALLET[c])WALLET[c].rate=P.rates[c];
    S.pricing=P;paintCfg();
  }catch(e){}

// the page checks the server for the owner's replies and close/reopen changes
function startPoll(tk){
  if(!LIVE||!tk.tid||tk.poll)return;
  tk.poll=setInterval(()=>pollTicket(tk),8000);
  pollTicket(tk);
}
async function pollTicket(tk){
  try{
    const r=await api("/tickets?id="+tk.tid+"&token="+tk.ttoken);
    tk.seen=tk.seen||[];
    let added=false;
    for(const m of r.messages){
      if(m.sender!=="joe"||tk.seen.includes(m.id))continue;
      tk.seen.push(m.id);
      tk.msgs.push({f:"joe",text:m.text||"",files:(m.files||[]).map(f=>({name:f.name,img:true,url:f.data}))});added=true;
    }
    if(r.status==="closed"&&!tk.closedNoted){tk.closedNoted=true;tk.msgs.push({f:"joe",text:t("ticketClosed")});added=true}
    if(r.status!=="closed"&&tk.closedNoted){tk.closedNoted=false;tk.msgs.push({f:"joe",text:t("ticketOpened")});added=true}
    if(added)refresh();
  }catch(e){}
}

  $("#buyEmail").placeholder=t("invEmail");$("#supEmail").placeholder=t("yourEmail");paintAcct();paintAuth();paintReviews();paintPolicy();paintNews();
  paintCfg();refresh();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b)return;
  const d=b.dataset;
  if(d.cfg){S.pkg=d.cfg;S.c={rooms:0,roles:0,bots:0};$("#notes").value="";paintCfg();$("#cfg").showModal()}
  else if(d.f){S.c[d.f]=Math.max(0,Math.min(99,S.c[d.f]+ +d.d));paintCfg();pulse($("#tot"))}
  else if(b.id==="buy")needUser(LIVE?buyLive:buy);
  else if(d.close!==undefined)b.closest("dialog").close();
  else if(d.hide!==undefined)$$(".drawer").forEach(a=>a.classList.remove("on"));
  else if(d.sup!==undefined)$("#sup").showModal();
  else if(d.reason)supportReason(d.reason);
  else if(d.coin){if(S.act.live)switchCoinLive(S.act,d.coin);else if(S.act.coin!==d.coin){S.act.coin=d.coin;S.act.ack=false;S.act.msgs.push({f:"me",text:t("chatCoinMe")+" "+d.coin})}refresh()}
  else if(d.act==="proofPick")$("#fProof").click();
  else if(d.act==="copyAmt")copyText(payOf(S.act).amount);
  else if(d.act==="copyAddr")copyText(payOf(S.act).addr);
  else if(d.act==="wallet")openWallet(S.act);
  else if(d.act==="paid"){if(S.act.ack&&S.act.proof){if(S.act.live)sendProofLive(S.act);else payMe(S.act)}}
  else if(d.act==="send"){const v=$("#pdraft").value.trim();if(v||S.staged.length){$("#pdraft").value="";sendMe(S.act,v,S.staged.splice(0))}}
  else if(d.att)$(d.att==="img"?"#fImg":"#fFile").click();
  else if(d.unstage!==undefined){S.staged.splice(+d.unstage,1);paintPanel()}
  else if(d.open!==undefined){$("#owner").innerHTML="";S.own=d.open;paintOwner()}
  else if(d.back!==undefined){S.own=null;paintOwner()}
  else if(d.act==="oreply"){const tk=S.tickets.find(x=>x.id===S.own),v=$("#odraft").value.trim();if(tk&&v){tk.msgs.push({f:"joe",text:v});$("#odraft").value="";toast(t("newReply"));refresh()}}
  else if(d.act==="confirm"){const tk=S.tickets.find(x=>x.id===d.id);if(tk&&tk.status==="verify")completeOrder(tk)}
  else if(d.policy!==undefined)$("#policy").showModal();
  else if(d.tk!==undefined){S.act=S.tickets.find(x=>x.id===d.tk);show("panel");paintPanel()}
  else if(b.id==="myt"){paintMine();show("mine")}
  else if(b.id==="otpBtn")verifyOtp();
  else if(b.id==="otpResend")resendOtp();
  else if(b.id==="otpBack"){hideOtp();$("#aPass").value=""}
  else if(d.owner!==undefined){show("owner");paintOwner()}
  else if(b.id==="acct"){if(S.user){setSession(null);toast(t("outDone"))}else openAuth()}
  else if(b.id==="applyCode")applyCode();
  else if(d.mode!==undefined){authUp=d.mode==="up";paintAuth()}
  else if(d.star){S.stars=+d.star;paintStars()}
  else if(b.id==="lang"){S.lang=S.lang==="en"?"ar":"en";apply()}
  else if(b.id==="rateBtn")$("#rate").classList.toggle("open");
  else if(b.id==="rsend"){if(S.stars){const txt=$("#rtext").value.trim()||t("rated");S.reviews.unshift({n:"Guest",s:S.stars,en:txt,ar:txt});paintReviews()}toast(t("rated"));S.stars=0;paintStars();$("#rate").classList.remove("open");$("#rtext").value=""}
});

$$(".tilt").forEach(el=>{
