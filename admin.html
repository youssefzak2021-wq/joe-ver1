<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>joe · owner</title>
<style>
body{font-family:system-ui,sans-serif;background:#efe9d6;color:#2b2820;margin:0;padding:24px;max-width:1100px}
h1{font-family:Georgia,serif;font-weight:500}
h2{font-family:Georgia,serif;font-weight:500;margin-top:28px}
.card{background:#fbf9f1;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input,textarea{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid #b7af98;background:#fff;width:100%}
button{font:inherit;padding:9px 14px;border-radius:10px;border:0;background:#2b2820;color:#f4efdf;cursor:pointer}
img{width:140px;border-radius:10px;border:1px solid #b7af98}
.tag{padding:3px 10px;border-radius:999px;background:#ddd5c1;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:#7a7266;font-size:14px}
.mono{font-family:ui-monospace,monospace;font-size:13px;word-break:break-all}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body>
<h1>joe · owner</h1>
<div class="row"><input id="key" type="password" placeholder="Admin key" style="max-width:300px"><button id="open">Open</button><span id="msg" class="muted"></span></div>
<h2>Orders and payments</h2>
<div id="orders"><p class="muted">Enter the admin key to see orders.</p></div>
<h2>Codes and news</h2>
<div class="card"><div class="grid">
<input id="te" placeholder="Title (English)"><input id="ta" placeholder="العنوان (عربي)">
<textarea id="be" rows="3" placeholder="Body (English)"></textarea><textarea id="ba" rows="3" placeholder="المحتوى (عربي)"></textarea>
</div><p><button id="addNews">Publish news</button> <span id="nmsg" class="muted"></span></p></div>
<div id="news"></div>
<p class="muted">Support tickets are not stored on the server yet, so they only appear in the customer's browser.</p>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
let KEY=sessionStorage.getItem("joe_admin_key")||"";
$("#key").value=KEY;
async function call(path,opt){
  opt=opt||{};
  const r=await fetch(path,{method:opt.method||"GET",headers:{"Content-Type":"application/json","x-admin-key":KEY},body:opt.body});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||("Error "+r.status));
  return j;
}
async function loadOrders(){
  try{
    const list=await call("/api/admin/orders");
    $("#orders").innerHTML=list.length?list.map(o=>`<div class="card">
      <div class="row"><b>${esc(o.ref)}</b><span class="tag">${esc(o.status)}</span><span>${esc(o.email)}</span><span>${esc(o.pkg)} · $${Number(o.usd).toFixed(2)}</span></div>
      <p>${esc(o.pay.amount)} ${esc(o.pay.coin)} · ${esc(o.pay.net)}</p>
      <p class="mono">${esc(o.pay.addr)}</p>
      ${o.proof?`<div class="row"><img src="${esc(o.proof.data)}" alt=""><span>${esc(o.proof.name)}</span></div>`:'<p class="muted">No transfer screenshot yet.</p>'}
      ${o.status==="paid"?'<p class="muted">Paid and invoiced.</p>':`<p><button data-confirm="${esc(o.id)}">Confirm payment</button></p>`}
    </div>`).join(""):'<p class="muted">No orders yet.</p>';
    $("#msg").textContent="Updated "+new Date().toLocaleTimeString();
  }catch(e){$("#msg").textContent=e.message}
}
async function loadNews(){
  const list=await call("/api/news").catch(()=>[]);
  $("#news").innerHTML=list.map(n=>`<div class="card"><span class="tag">${esc(n.date)}</span><h3>${esc(n.title.en)} · ${esc(n.title.ar)}</h3><p>${esc(n.body.en)}</p><p>${esc(n.body.ar)}</p></div>`).join("");
}
document.addEventListener("click",async e=>{
  const id=e.target.dataset.confirm;
  if(!id)return;
  try{await call("/api/admin/orders/"+id+"/confirm",{method:"POST",body:"{}"});loadOrders()}catch(err){$("#msg").textContent=err.message}
});
$("#open").onclick=()=>{KEY=$("#key").value.trim();sessionStorage.setItem("joe_admin_key",KEY);loadOrders()};
$("#addNews").onclick=async()=>{
  try{
    await call("/api/admin/news",{method:"POST",body:JSON.stringify({title_en:$("#te").value,title_ar:$("#ta").value,body_en:$("#be").value,body_ar:$("#ba").value})});
    $("#nmsg").textContent="Published.";["te","ta","be","ba"].forEach(i=>$("#"+i).value="");loadNews();
  }catch(e){$("#nmsg").textContent=e.message}
};
loadNews();if(KEY)loadOrders();setInterval(()=>{if(KEY)loadOrders()},30000);
</script></body></html>
